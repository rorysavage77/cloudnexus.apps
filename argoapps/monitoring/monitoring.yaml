apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 3.8.0
    helm:
      values: |
        cluster:
          name: starbase

        kube-state-metrics:
          enabled: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          extraArgs:
            - --use-discovery-endpoint-slice=true
            - --resources=-endpoints 

        alloy-operator:
          enabled: true

        alloy-metrics:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

        # Features - Ensure these are explicitly set to true
        clusterMetrics:
          enabled: true
        clusterEvents:
          enabled: true
        podLogs:
          enabled: true

        destinations:
          - name: local-prometheus
            type: prometheus
            # Ensure this points to the correct service name created by the stack
            url: http://monitoring-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
          - name: loki-destination
            type: loki
            url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
