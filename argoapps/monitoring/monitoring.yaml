apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 3.8.0
    helm:
      values: |
        cluster:
          name: starbase

        # --- Fix for Dashboard Variable Mismatch ---
        # This forces the job label to match the hardcoded dashboard variables
        metrics:
          alloy:
            extraConfig: |
              prometheus.relabel "fix_job_names" {
                forward_to = [prometheus.remote_write.local_prometheus.receiver]
                rule {
                  source_labels = ["job"]
                  regex         = "integrations/kubernetes/kube-state-metrics"
                  replacement   = "kube-state-metrics"
                  target_label  = "job"
                }
              }

        alloy-operator:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        alloy-metrics:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

        alloy-singleton:
          enabled: true
        alloy-logs:
          enabled: true

        clusterMetrics:
          enabled: true
        clusterEvents:
          enabled: true
        podLogs:
          enabled: true

        kube-state-metrics:
          enabled: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          extraArgs:
            - --use-discovery-endpoint-slice=true
            - --resources=-endpoints 

        destinations:
          - name: local-prometheus
            type: prometheus
            url: http://monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
          - name: loki-destination
            type: loki
            url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
