apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 3.8.0
    helm:
      values: |
        cluster:
          name: starbase

        # --- Fix for the Alloy Operator Crash ---
        # Ensures the operator is "Burstable" and not throttled during syncs
        alloy-operator:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # --- Collector Enablement ---
        # Explicitly enabled to satisfy Helm validation logic
        alloy-metrics:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

        alloy-singleton:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi

        alloy-logs:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi

        # --- Feature Toggles ---
        clusterMetrics:
          enabled: true
        clusterEvents:
          enabled: true
        podLogs:
          enabled: true

        # --- Resource & API Fixes for v1.35.1 ---
        # Stabilizes KSM and bypasses deprecated endpoint logic
        kube-state-metrics:
          enabled: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          extraArgs:
            - --use-discovery-endpoint-slice=true
            - --resources=-endpoints 

        # --- Destination Configuration ---
        # Points to the specific Prometheus service name in your cluster
        destinations:
          - name: local-prometheus
            type: prometheus
            url: http://monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
          - name: loki-destination
            type: loki
            url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
