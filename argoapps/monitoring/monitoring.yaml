apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 3.8.0
    helm:
      values: |
        cluster:
          name: starbase
        
        # Features
        clusterMetrics:
          enabled: true
        clusterEvents:
          enabled: true
        podLogs:
          enabled: true

        # Explicitly enabling the Alloy collectors to satisfy validations
        alloy-metrics:
          enabled: true
        alloy-singleton:
          enabled: true
        alloy-logs:
          enabled: true

        destinations:
          #- name: prometheus-destination
          #  type: prometheus
          #  url: http://prometheus-server.monitoring.svc.cluster.local/api/v1/write
          - name: loki-destination
            type: loki
            url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
          - name: local-prometheus
            type: prometheus
            url: http://monitoring-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
