apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 3.8.0
    helm:
      values: |
        cluster:
          name: starbase
        clusterMetrics:
          enabled: true
        clusterEvents:
          enabled: true
        podLogs:
          enabled: true
        alloy-metrics:
          enabled: true
          deploy: true
        alloy-singleto:
          enabled: true

        # Mandatory: Where to send the data
        destinations:
          - name: prometheus-destination
            type: prometheus
            url: http://prometheus-server.monitoring.svc.cluster.local/api/v1/write
            # auth:
            #   type: basic
            #   username: "your-id"
            #   password: "your-password"
          
          - name: loki-destination
            type: loki
            url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
            # auth:
            #   type: basic
            #   username: "your-id"
            #   password: "your-password"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
