apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.11.0
    helm:
      values: |
        # --- Alertmanager Section ---
        alertmanager:
          enabled: true
          ingress:
            enabled: false # Set to true if you have an ingress controller
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'cluster', 'service']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: 'null'
            receivers:
              - name: 'null'
          alertmanagerSpec:
            storage:
              emptyDir: {}

        grafana:
          enabled: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL
          dashboardProviders: 
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: 'default'
                  orgId: 1
                  folder: ''
                  type: file
                  disableDeletion: false
                  editable: true
                  allowUiUpdates: true
                  options:
                    path: /var/lib/grafana/dashboards/default

        prometheus:
          enabled: true
          prometheusSpec:
            enableRemoteWriteReceiver: true
            scrapeConfigSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            storageSpec:
              emptyDir:
                medium: ""
            retention: 10d

        prometheusOperator:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          kubeletService:
            enabled: true
            endpointSlice: true

        # Keep these as-is based on your Alloy setup
        prometheus-node-exporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
        nodeExporter:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
