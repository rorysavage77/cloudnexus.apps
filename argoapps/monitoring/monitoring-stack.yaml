apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.x.x
    helm:
      values: |
        grafana:
          enabled: true
        prometheus:
          prometheusSpec:
            # This enables the receiver for your Alloy pods
            enableRemoteWriteReceiver: true
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
