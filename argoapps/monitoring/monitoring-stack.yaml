apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.11.0
    helm:
      values: |
        grafana:
          enabled: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL

        prometheus:
          enabled: true
          prometheusSpec:
            storageSpec:
              emptyDir:
                medium: ""
            enableRemoteWriteReceiver: true
            retention: 10d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false

        # --- Fix for the Pending Operator ---
        prometheusOperator:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Forces the operator to use EndpointSlices for the Kubelet (v1.35 requirement)
          kubeletService:
            enabled: true
            endpointSlice: true

        # --- Fix for the Missing Secret (Admission Webhooks) ---
        prometheus-node-exporter:
          enabled: false
        kubeStateMetrics:
          enabled: false

        # Disable redundant collectors
        nodeExporter:
          enabled: false

        # Disable Alertmanager to save resources
        alertmanager:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
