apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.11.0
    helm:
      values: |
        grafana:
          enabled: true
          # Optional: Use a sidecar to auto-import dashboards from ConfigMaps
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL

        prometheus:
          prometheusSpec:
            # ESSENTIAL: This allows Alloy to push data to this Prometheus instance
            enableRemoteWriteReceiver: true
            # Storage retention (adjust as needed for starbase)
            retention: 10d
        
        # Disable redundant collectors already provided by k8s-monitoring
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
        
        # Optional: Disable Alertmanager if you aren't using it yet
        alertmanager:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
