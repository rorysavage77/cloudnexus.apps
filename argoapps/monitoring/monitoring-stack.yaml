apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.11.0
    helm:
      values: |
        grafana:
          enabled: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL

        prometheus:
          enabled: true
          prometheusSpec:
            # FIX: Allows Prometheus to start without needing a Persistent Volume (PV)
            storageSpec:
              emptyDir:
                medium: ""
            
            # ESSENTIAL: This allows your Alloy pods to push data to this instance
            enableRemoteWriteReceiver: true
            
            # Retention settings for starbase
            retention: 10d

            # Ensures the operator discovers monitoring resources correctly
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false

        # Disable redundant collectors (already handled by k8s-monitoring app)
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
        
        # Disable Alertmanager to save resources until you need it
        alertmanager:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
