apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnexus-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  destination:
    name: in-cluster
    namespace: argocd
  source:
    repoURL: 'https://github.com/rorysavage77/cloudnexus.apps'
    path: argoapps
    targetRevision: HEAD
    directory:
      recurse: true
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
